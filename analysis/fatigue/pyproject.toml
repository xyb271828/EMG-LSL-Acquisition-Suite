[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emg-fatigue-core"
version = "1.0.0"
description = "Offline perceived-fatigue regression, Gaussian processes and uncertainty diagnostics"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "scikit-learn>=1.5", "joblib>=1.3", "pyxdf>=1.17"]

[project.optional-dependencies]
neural = ["torch>=2.2"]

[project.scripts]
emg-fatigue = "emgfatigue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
